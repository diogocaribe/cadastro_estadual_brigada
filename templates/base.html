<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Cadastro Estadual de Brigadas{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    {% block head %}{% endblock %}
    <style>
        :root {
            --bg: #f5f5f4;
            --surface: #ffffff;
            --surface-muted: #fafaf9;
            --ink: #1c1917;
            --muted: #57534e;
            --subtle: #78716c;
            --line: #e7e5e4;
            --line-strong: #d6d3d1;
            --brand: #b42318;
            --brand-hover: #912018;
            --brand-soft: #fef3f2;
            --brand-dark: #1c1917;
            --focus: 0 0 0 3px rgba(180, 35, 24, 0.18);
            --danger: #b42318;
            --danger-soft: #fef3f2;
            --success: #067647;
            --success-soft: #ecfdf3;
            --radius: 10px;
            --radius-lg: 14px;
            --shadow-sm: 0 1px 2px rgba(28, 25, 23, 0.06);
            --shadow: 0 1px 3px rgba(28, 25, 23, 0.06), 0 10px 30px rgba(28, 25, 23, 0.06);
        }

        * { box-sizing: border-box; }

        html { -webkit-text-size-adjust: 100%; }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg);
            color: var(--ink);
            font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            font-size: 15px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        h1, h2, h3 { margin: 0; line-height: 1.25; letter-spacing: -0.01em; }
        p { margin: 0; }
        a { color: var(--brand); text-decoration: none; font-weight: 500; }
        a:hover { text-decoration: underline; }

        /* Marca */
        .brand {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: inherit;
            font-weight: 700;
            letter-spacing: -0.01em;
        }
        .brand:hover { text-decoration: none; }
        .brand-mark {
            width: 36px;
            height: 36px;
            flex-shrink: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            background: var(--brand);
            color: #fff;
        }
        .brand-mark svg { width: 20px; height: 20px; }

        /* Campos */
        .field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
        .field-label-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
        .field label { font-size: 0.875rem; font-weight: 600; color: var(--ink); }
        .field .optional { font-weight: 400; color: var(--subtle); }

        .field input,
        .field select,
        .field textarea,
        .input {
            width: 100%;
            height: 42px;
            padding: 0 12px;
            border: 1px solid var(--line-strong);
            border-radius: var(--radius);
            background: var(--surface);
            color: var(--ink);
            font: inherit;
            box-shadow: var(--shadow-sm);
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }
        .field textarea { height: auto; min-height: 110px; padding: 10px 12px; resize: vertical; }
        .field input::placeholder,
        .input::placeholder { color: #a8a29e; }
        .field input:focus,
        .field select:focus,
        .field textarea:focus,
        .input:focus {
            outline: none;
            border-color: var(--brand);
            box-shadow: var(--focus);
        }
        .field.has-error input,
        .field.has-error textarea { border-color: var(--danger); }
        .field-error { font-size: 0.8125rem; color: var(--danger); font-weight: 500; }
        .field-help { font-size: 0.8125rem; color: var(--subtle); }
        .field-help ul { margin: 4px 0 0; padding-left: 18px; }

        /* Botões */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            height: 42px;
            padding: 0 18px;
            border: 1px solid transparent;
            border-radius: var(--radius);
            font: inherit;
            font-weight: 600;
            font-size: 0.9375rem;
            cursor: pointer;
            text-decoration: none;
            white-space: nowrap;
            transition: background-color 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
        }
        .btn:hover { text-decoration: none; }
        .btn:focus-visible { outline: none; box-shadow: var(--focus); }
        .btn svg { width: 18px; height: 18px; }
        .btn-primary { background: var(--brand); color: #fff; box-shadow: var(--shadow-sm); }
        .btn-primary:hover { background: var(--brand-hover); }
        .btn-secondary { background: var(--surface); color: var(--ink); border-color: var(--line-strong); box-shadow: var(--shadow-sm); }
        .btn-secondary:hover { background: var(--surface-muted); border-color: #a8a29e; }
        .btn-block { width: 100%; }
        .btn-sm { height: 36px; padding: 0 12px; font-size: 0.875rem; }

        /* Alertas */
        .alert {
            display: flex;
            gap: 10px;
            padding: 12px 14px;
            border: 1px solid;
            border-radius: var(--radius);
            font-size: 0.875rem;
        }
        .alert p + p { margin-top: 4px; }
        .alert svg { width: 18px; height: 18px; flex-shrink: 0; margin-top: 1px; }
        .alert-success { background: var(--success-soft); border-color: #abefc6; color: #054f31; }
        .alert-error { background: var(--danger-soft); border-color: #fecdca; color: #7a271a; }
    </style>
    {% block extra_style %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
    {% block body %}{% endblock %}
    {% block scripts %}{% endblock %}
</body>
</html>
